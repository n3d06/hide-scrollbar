name: Test and Release

on:
  push:
    branches:
      - main
      - master
    # Only release when the extension itself changes (not docs-only commits)
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/release.yml'
  pull_request:
  workflow_dispatch:

# One release at a time; a newer push waits instead of racing for the same tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

      - name: Build Chrome and Firefox packages
        run: npm run build

  release:
    needs: test
    # Pull requests only run the tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build Chrome and Firefox packages
        run: npm run build

      - name: Compute version
        run: |
          BASE_VERSION=$(jq -r '.version' src/manifest.json)
          RUN_NUMBER=${{ github.run_number }}
          MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
          MINOR_BASE=$(echo "$BASE_VERSION" | cut -d. -f2)
          MINOR_BASE=${MINOR_BASE:-0}

          PATCH=$((RUN_NUMBER % 10))
          INCREMENT=$((RUN_NUMBER / 10))
          NEW_MINOR=$((MINOR_BASE + INCREMENT))

          NEW_VERSION="${MAJOR}.${NEW_MINOR}.${PATCH}"
          echo "Updating version from $BASE_VERSION to $NEW_VERSION"
          echo "VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Write version into manifests
        run: |
          for target in chrome firefox; do
            jq --arg v "$VERSION" '.version = $v' "dist/$target/manifest.json" > tmp.json
            mv tmp.json "dist/$target/manifest.json"
          done

      - name: Create ZIPs
        run: |
          for target in chrome firefox; do
            (cd "dist/$target" && zip -qr "../../extension-$target-v$VERSION.zip" .)
          done
          ls -lh extension-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            extension-chrome-v${{ env.VERSION }}.zip
            extension-firefox-v${{ env.VERSION }}.zip
          fail_on_unmatched_files: true
